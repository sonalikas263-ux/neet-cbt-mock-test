<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>NEET CBT - Result</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="result-container">

    <div class="result-box">

        <h1>EXAM RESULT</h1>

        <h2 id="studentName"></h2>


        <div class="score">

            <h3>Score</h3>

            <div id="marks"></div>

            <p>Out of 720</p>

        </div>


        <div class="result-grid">

            <div>

                <strong id="correct"></strong>

                <span>Correct</span>

            </div>


            <div>

                <strong id="wrong"></strong>

                <span>Wrong</span>

            </div>


            <div>

                <strong id="unattempted"></strong>

                <span>Unattempted</span>

            </div>

        </div>


        <button onclick="location.href='index.html'">

            Take Test Again

        </button>

    </div>

</div>


<script src="js/result.js"></script>

</body>

</html>
