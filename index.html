<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>NEET CBT - Student Login</title>

    <!-- CSS is in the same folder -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="login-container">

    <div class="login-box">

        <h1>NEET CBT MOCK TEST</h1>

        <p class="subtitle">
            Computer Based Test
        </p>

        <label for="studentName">
            Student Name
        </label>

        <input
            type="text"
            id="studentName"
            placeholder="Enter your name"
            autocomplete="off"
        >

        <button
            type="button"
            onclick="startTest()"
        >
            Login & Continue
        </button>

        <p id="errorMessage" class="error"></p>

    </div>

</div>

<!-- JS is in the same folder -->
<script src="login.js"></script>

</body>
</html>
