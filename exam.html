<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>NEET CBT Exam</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<header class="exam-header">

    <div>

        <h2>NEET CBT MOCK TEST</h2>

        <span id="studentDisplay"></span>

    </div>

    <div class="timer-box">

        Time Left:

        <span id="timer">200:00</span>

    </div>

</header>


<div class="exam-container">

    <!-- QUESTION AREA -->

    <div class="question-section">

        <div class="question-top">

            <span id="questionNumber">
                Question 1
            </span>

            <span id="marksInfo">
                +4 / -1
            </span>

        </div>


        <div class="question-box">

            <h3 id="questionText"></h3>

            <div id="optionsContainer"></div>

        </div>


        <div class="navigation">

            <button
                id="previousBtn"
                onclick="previousQuestion()"
            >
                Previous
            </button>

            <button
                onclick="clearResponse()"
                class="clear-btn"
            >
                Clear Response
            </button>

            <button
                onclick="nextQuestion()"
            >
                Save & Next
            </button>

        </div>

    </div>


    <!-- QUESTION PALETTE -->

    <div class="palette-section">

        <h3>Question Palette</h3>

        <div class="legend">

            <div>
                <span class="legend-box answered"></span>
                Answered
            </div>

            <div>
                <span class="legend-box unattempted"></span>
                Unattempted
            </div>

            <div>
                <span class="legend-box current"></span>
                Current
            </div>

        </div>

        <div
            id="questionPalette"
            class="question-palette"
        ></div>

        <button
            class="submit-btn"
            onclick="submitExam()"
        >
            Submit Exam
        </button>

    </div>

</div>

<script src="js/exam.js"></script>

</body>

</html>
