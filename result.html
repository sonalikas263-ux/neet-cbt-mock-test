<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>NEET CBT - Result</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="result-container">

    <div class="result-box">

        <h1>
            EXAM RESULT
        </h1>


        <h2 id="studentName"></h2>


        <div class="score">

            <h3>
                Score
            </h3>


            <div id="marks">
                0
            </div>


            <p>
                Out of 720
            </p>

        </div>


        <div class="result-grid">


            <div>

                <strong id="correct">
                    0
                </strong>

                <span>
                    Correct
                </span>

            </div>


            <div>

                <strong id="wrong">
                    0
                </strong>

                <span>
                    Wrong
                </span>

            </div>


            <div>

                <strong id="unattempted">
                    0
                </strong>

                <span>
                    Unattempted
                </span>

            </div>


        </div>


        <button
            type="button"
            onclick="location.href='index.html'"
        >
            Take Test Again
        </button>

    </div>

</div>


<script src="result.js"></script>

</body>

</html>
